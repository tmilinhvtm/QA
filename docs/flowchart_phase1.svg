<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 680" width="1600" height="680" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0D9488" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>

    <!-- Filters -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="shadow-gate" x="-8%" y="-8%" width="116%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#E11D48" flood-opacity="0.14"/>
    </filter>
  </defs>


  <!-- Header Banner -->
  <rect x="20" y="16" width="1560" height="64" rx="10" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="44" y="44" fill="#6D28D9" font-size="16" font-weight="900">🟣 SƠ ĐỒ LUỒNG PHA 1: QUY TRÌNH 2 PHÂN ĐOẠN 1A &amp; 1B KÈM HUMAN GATE 1 (req-risk-analyst)</text>
  <text x="44" y="66" fill="#7C3AED" font-size="12" font-weight="600">Pha 1A (Hiển thị 1 &amp; 2) ➔ Chốt chặn Human Gate 1 (Bật Modal ask_question) ➔ Pha 1B (Quét 5 Rủi ro &amp; Bug theo quyết định BA) ➔ Cấm sinh test sớm</text>

  <!-- Start Pill -->
  <rect x="25" y="265" width="125" height="70" rx="35" fill="#F1F5F9" stroke="#64748B" stroke-width="2" filter="url(#shadow)"/>
  <text x="87" y="295" fill="#1E293B" font-size="12" font-weight="800" text-anchor="middle">📥 ĐẦU VÀO</text>
  <text x="87" y="315" fill="#64748B" font-size="10.5" text-anchor="middle">Spec &amp; Prefs</text>

  <path d="M 150 300 L 185 300" stroke="#7C3AED" stroke-width="2.5" fill="none" marker-end="url(#arr-purple)"/>

  <!-- Phase 1A Container -->
  <g transform="translate(190, 115)">
    <rect x="0" y="0" width="355" height="370" rx="12" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
    
    <rect x="15" y="12" width="325" height="26" rx="5" fill="#EDE9FE"/>
    <text x="177" y="29" fill="#6D28D9" font-size="11" font-weight="900" text-anchor="middle">PHA 1A: BUSINESS RULES &amp; CÂU HỎI BA</text>

    <!-- Sub-box 1A.1: 4 Core Elements -->
    <rect x="15" y="48" width="325" height="148" rx="8" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.2"/>
    <text x="28" y="68" fill="#6D28D9" font-size="11" font-weight="900">1. BÓC TÁCH 4 THÀNH TỐ</text>
    <text x="28" y="88" fill="#1E293B" font-size="10" font-weight="700">⚙️ 1. Core Rules:</text>
    <text x="130" y="88" fill="#64748B" font-size="9.5">Điều kiện kích hoạt &amp; logic</text>
    <text x="28" y="107" fill="#1E293B" font-size="10" font-weight="700">📏 2. Boundary Limits:</text>
    <text x="145" y="107" fill="#64748B" font-size="9.5">Biên số liệu &amp; TTL token</text>
    <text x="28" y="126" fill="#1E293B" font-size="10" font-weight="700">🔄 3. User Journey:</text>
    <text x="130" y="126" fill="#64748B" font-size="9.5">Hành trình &amp; rẽ nhánh luồng</text>
    <text x="28" y="145" fill="#1E293B" font-size="10" font-weight="700">💾 4. Data &amp; Exceptions:</text>
    <text x="150" y="145" fill="#64748B" font-size="9.5">Ràng buộc bảng &amp; lỗi mạng</text>

    <!-- Sub-box 1A.2: Questions for BA -->
    <rect x="15" y="204" width="325" height="152" rx="8" fill="#FFF1F2" stroke="#FCA5A5" stroke-width="1.2"/>
    <text x="28" y="224" fill="#BE123C" font-size="11" font-weight="900">2. QUESTIONS FOR BA (KÈM GỢI Ý)</text>
    <text x="28" y="244" fill="#991B1B" font-size="10" font-weight="700">❓ Soạn câu hỏi phản biện làm rõ điểm mờ</text>
    <text x="36" y="261" fill="#4C0519" font-size="9">• "Xử lý thế nào khi 2 user cùng tranh mua?"</text>
    <text x="36" y="276" fill="#4C0519" font-size="9">• "Hủy đơn có tự động hoàn lại voucher?"</text>
    <text x="28" y="296" fill="#15803D" font-size="10" font-weight="800">💡 Chuẩn bị sẵn Options (Phương án A, B, C)</text>
    <text x="28" y="316" fill="#7C3AED" font-size="10" font-weight="800">📢 Xuất trực tiếp ra luồng Chat chính</text>
    <text x="28" y="335" fill="#BE123C" font-size="9.5" font-weight="700">🛑 Tạm dừng tiến trình để chuyển sang Gate 1</text>
  </g>

  <!-- Arrow from Phase 1A to Gate 1 -->
  <path d="M 545 300 L 595 300" stroke="#E11D48" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>

  <!-- Human Gate 1: Interactive Choice Modal via ask_question -->
  <g transform="translate(605, 175)">
    <polygon points="125,0 250,125 125,250 0,125" fill="#FFF1F2" stroke="#E11D48" stroke-width="3" filter="url(#shadow-gate)"/>
    <text x="125" y="70" font-size="22" text-anchor="middle">🛑</text>
    <text x="125" y="96" fill="#BE123C" font-size="13" font-weight="900" text-anchor="middle">HUMAN GATE 1</text>
    <text x="125" y="116" fill="#991B1B" font-size="11" font-weight="800" text-anchor="middle">BẬT MODAL CHỌN NGAY</text>
    <rect x="30" y="126" width="190" height="24" rx="4" fill="#FFFFFF" stroke="#F87171"/>
    <text x="125" y="142" fill="#BE123C" font-size="10.5" font-weight="900" text-anchor="middle">Công cụ ask_question</text>
    <text x="125" y="168" fill="#4C0519" font-size="9.5" font-weight="700" text-anchor="middle">Tester/BA click chọn trực tiếp</text>
    <text x="125" y="186" fill="#DC2626" font-size="9.5" font-weight="800" text-anchor="middle">KHÓA TIẾN TRÌNH CHỜ DUYỆT</text>
    <rect x="25" y="196" width="200" height="22" rx="4" fill="#DCFCE7" stroke="#86EFAC"/>
    <text x="125" y="211" fill="#15803D" font-size="9.5" font-weight="900" text-anchor="middle">Ghi nhận BA Decisions Log</text>
  </g>

  <!-- Arrow from Gate 1 to Phase 1B -->
  <path d="M 855 300 L 905 300" stroke="#16A34A" stroke-width="2.8" fill="none" marker-end="url(#arr-green)"/>
  <rect x="850" y="274" width="60" height="20" rx="4" fill="#DCFCE7" stroke="#16A34A"/>
  <text x="880" y="288" fill="#15803D" font-size="9.5" font-weight="900" text-anchor="middle">ĐÃ CHỐT</text>

  <!-- Phase 1B Container -->
  <g transform="translate(915, 115)">
    <rect x="0" y="0" width="375" height="370" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/>
    
    <rect x="15" y="12" width="345" height="26" rx="5" fill="#DCFCE7"/>
    <text x="187" y="29" fill="#15803D" font-size="11" font-weight="900" text-anchor="middle">PHA 1B: PHÂN TÍCH RỦI RO THEO QUYẾT ĐỊNH BA</text>

    <!-- Sub-box 1B.1: 5 Technical Risks -->
    <rect x="15" y="48" width="345" height="150" rx="8" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.2"/>
    <text x="28" y="70" fill="#15803D" font-size="11" font-weight="900">3. QUÉT 5 RỦI RO KIẾN TRÚC SÂU</text>
    <rect x="28" y="78" width="315" height="20" rx="4" fill="#FEF3C7"/>
    <text x="185" y="92" fill="#B45309" font-size="9.5" font-weight="800" text-anchor="middle">🎯 Bám sát đúng phương án BA đã chọn từ Modal!</text>
    <text x="28" y="116" fill="#1E293B" font-size="10">• 1. Race Condition &amp; Lost Update (≤50ms)</text>
    <text x="28" y="134" fill="#1E293B" font-size="10">• 2. Concurrency Deadlock &amp; Distributed Lock</text>
    <text x="28" y="152" fill="#1E293B" font-size="10">• 3. JWT State Drift &amp; Force Logout Revocation</text>
    <text x="28" y="170" fill="#1E293B" font-size="10">• 4. Clock Drift &amp; Idempotency Token</text>
    <text x="28" y="188" fill="#1E293B" font-size="10">• 5. 3-Tier Payload Verification (UI/API/DB)</text>

    <!-- Sub-box 1B.2: Map Bugs Ground Truth -->
    <rect x="15" y="210" width="345" height="145" rx="8" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="1.2"/>
    <text x="28" y="232" fill="#15803D" font-size="11" font-weight="900">4. ĐỐI CHIẾU 10 BUGS LỊCH SỬ</text>
    <text x="28" y="254" fill="#1E293B" font-size="10">• Đọc tệp local: data/bug_repository.json</text>
    <text x="28" y="272" fill="#1E293B" font-size="10">• Map Defect tương đồng: BUG-001, BUG-004...</text>
    <text x="28" y="292" fill="#15803D" font-size="10" font-weight="800">🎯 Mỏ neo chống ảo giác cho AI</text>
    <text x="28" y="312" fill="#7C3AED" font-size="10" font-weight="800">📢 Xuất toàn bộ nội dung ra luồng Chat chính</text>
    <text x="28" y="332" fill="#0F766E" font-size="9.5" font-weight="700">✔ Sẵn sàng bàn giao dữ liệu sang Pha 2</text>
  </g>

  <!-- Arrow to Rule 1 -->
  <path d="M 1290 300 L 1335 300" stroke="#DC2626" stroke-width="2.8" fill="none" marker-end="url(#arr-red)"/>

  <!-- Rule 1 Constraint & Handover Box -->
  <g transform="translate(1340, 145)">
    <rect x="0" y="0" width="235" height="310" rx="12" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5" filter="url(#shadow-gate)"/>
    <text x="117" y="38" font-size="28" text-anchor="middle">⛔🛑</text>
    <text x="117" y="68" fill="#991B1B" font-size="12" font-weight="900" text-anchor="middle">RÀNG BUỘC CỨNG (RULE 1)</text>
    
    <rect x="15" y="82" width="205" height="42" rx="6" fill="#FFFFFF" stroke="#F87171"/>
    <text x="117" y="99" fill="#7F1D1D" font-size="10.5" font-weight="900" text-anchor="middle">TUYỆT ĐỐI CẤM TỰ Ý</text>
    <text x="117" y="115" fill="#7F1D1D" font-size="10.5" font-weight="900" text-anchor="middle">SINH TEST CASE SỚM!</text>
    
    <text x="117" y="145" fill="#991B1B" font-size="9.5" font-weight="700" text-anchor="middle">• Hoàn tất phân tích Pha 1</text>
    <text x="117" y="163" fill="#991B1B" font-size="9.5" font-weight="700" text-anchor="middle">• Đã chốt lựa chọn của BA</text>
    <text x="117" y="181" fill="#991B1B" font-size="9.5" font-weight="700" text-anchor="middle">• Đã xác định 5 rủi ro &amp; bugs</text>
    <text x="117" y="200" fill="#991B1B" font-size="9.5" font-weight="700" text-anchor="middle">• Không sinh test trong turn 1</text>
    
    <!-- Transition Button Pill -->
    <rect x="15" y="225" width="205" height="65" rx="10" fill="#16A34A" stroke="#15803D" stroke-width="1.5"/>
    <text x="117" y="250" fill="#FFFFFF" font-size="12" font-weight="900" text-anchor="middle">BÀN GIAO PHA 2 ➔</text>
    <text x="117" y="270" fill="#DCFCE7" font-size="9.5" font-weight="700" text-anchor="middle">test-automation-architect</text>
    <text x="117" y="284" fill="#BBF7D0" font-size="8.5" text-anchor="middle">(Thiết kế Test 3 tầng sâu)</text>
  </g>

  <!-- Bottom Guidelines Banner -->
  <rect x="20" y="575" width="1560" height="85" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="605" fill="#60A5FA" font-size="13" font-weight="900">💡 ĐẶC TẢ QUY TRÌNH PHA 1 THEO PROTOCOL CHUẨN CỦA HỆ THỐNG:</text>
  <text x="44" y="628" fill="#F1F5F9" font-size="11.5">
    • Bước 1 (Pha 1A): Bóc tách 4 thành tố &amp; Soạn câu hỏi phản biện BA kèm options ➔ Bước 2: BẮT BUỘC dừng lại, bật Modal ask_question để người dùng chọn trực tiếp.
  </text>
  <text x="44" y="648" fill="#F1F5F9" font-size="11.5">
    • Bước 3 (Pha 1B): Nhận kết quả từ Modal ➔ Quét 5 rủi ro kiến trúc sâu bám sát phương án BA đã chọn &amp; Đối chiếu kho Bug ➔ Ràng buộc cấm sinh test case trước Pha 2.
  </text>
</svg>